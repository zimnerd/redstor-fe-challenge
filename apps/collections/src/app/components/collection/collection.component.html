<mat-toolbar color="primary">
  <span>Redstor FE Challenger</span>
</mat-toolbar>

<nav class="breadcrumbs" aria-label="Breadcrumb navigation">
  <a routerLink="/" aria-label="Go to Collections">Collections</a>
  <span aria-hidden="true">›</span>
  <span class="active">Collection</span>
</nav>

<div class="layout-container">
  <mat-progress-bar mode="indeterminate" *ngIf="isLoading$ | async"></mat-progress-bar>

  <div class="photos-grid" *ngIf="!(isLoading$ | async)">
    <ng-container *ngIf="(photos$ | async)?.length; else noPhotos">
      <div class="gallery">
        <ng-container *ngFor="let photo of photos$ | async">
          <mat-card class="gallery-item" (click)="handleGotoPhoto(photo)">
            <img mat-card-image [src]="photo.urls.small" [alt]="photo.alt_description" loading="lazy" />
            <mat-card-content>
              <div class="photo-info">
                <button mat-icon-button class="favorite-button" aria-label="Like photo">
                  <mat-icon class="liked">favorite</mat-icon>
                </button>
                <span class="likes-count">{{ photo.likes | number }}</span>
              </div>
            </mat-card-content>
          </mat-card>
        </ng-container>
      </div>
    </ng-container>

    <ng-template #noPhotos>
      <div class="no-results">
        <mat-card>
          <mat-card-content>
            <p>No photos found in this collection.</p>
          </mat-card-content>
        </mat-card>
      </div>
    </ng-template>
  </div>

  <!-- Only show pagination if we have photos -->
  <mat-paginator
    *ngIf="(photos$ | async)?.length"
    [length]="total$ | async"
    [pageSize]="perPage"
    [pageSizeOptions]="pageSizeOptions"
    [showFirstLastButtons]="true"
    (page)="onPageChange($event)"
    aria-label="Select page">
  </mat-paginator>
</div>
