<!-- Improved toolbar with better semantics and accessibility -->
<mat-toolbar role="banner">
  <h1 class="app-title">Redstor FE Challenger</h1>
</mat-toolbar>

<!-- Improved breadcrumbs with proper navigation semantics -->
<nav class="breadcrumbs" aria-label="breadcrumb">
  <a class="active" aria-current="page">Collections</a>
</nav>

<div class="layout-container">
  <!-- Using Angular 17's built-in loading state management -->
  @if (isLoading) {
    <mat-progress-bar mode="indeterminate" aria-label="Loading collections"></mat-progress-bar>
  }

  <!-- Using new Angular 17 control flow and improved responsive layout -->
  <div class="gallery">
    @if (collections.length === 0 && !isLoading) {
      <p>No collections found.</p>
    }

    @for (collection of collections; track collection.id) {
      <mat-card
        class="gallery-item thumbnails"
        [routerLink]="['/collection', collection.id]"
        [attr.aria-label]="'View ' + collection.title + ' collection'"
      >
        <img
          mat-card-image
          [src]="collection.cover_photo.urls.small"
          [alt]="collection.cover_photo.description || collection.title"
          loading="lazy"
        />
        <mat-card-content>
          <p class="title">{{ collection.title }}</p>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
